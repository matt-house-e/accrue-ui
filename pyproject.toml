[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accrue-ui"
version = "0.1.0.dev0"
description = "Run-observability dashboard for accrue enrichment pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matt House" }]
dependencies = [
    "accrue>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[project.scripts]
accrue-ui = "accrue_ui.cli:main"

[project.urls]
Homepage = "https://github.com/matt-house-e/accrue-ui"
Issues = "https://github.com/matt-house-e/accrue-ui/issues"

[tool.ruff.lint.isort]
# Explicit so import sorting doesn't depend on whether accrue_ui is installed
# in the environment ruff runs from (hook, venv, CI).
known-first-party = ["accrue_ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["accrue_ui*"]

[tool.setuptools.package-data]
accrue_ui = ["static/**"]

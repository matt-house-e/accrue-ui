name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      # accrue-ui tracks accrue@main until the run-log contract ships in a
      # PyPI release — the integration tests drive Pipeline.run(run_log=...)
      # and retry_failed_async, which 1.3.0 does not have.
      - name: Install accrue from main
        # --force-reinstall: main's version string still equals the PyPI
        # release, so plain pip considers the requirement satisfied
        run: pip install --force-reinstall --no-deps "git+https://github.com/matt-house-e/accrue.git"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
